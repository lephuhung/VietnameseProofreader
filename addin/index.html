<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VN Grammar Assistant</title>

    <script src="lib/office.js" type="text/javascript"></script>
    <link rel="stylesheet" href="style.css?v=20260314b" />
</head>
<body class="ms-font-m">
    <div id="app" class="glass-panel">

        <!-- Settings Toggle -->
        <button class="settings-toggle" id="settings-toggle" title="Cài đặt" aria-label="Toggle settings">
            <!-- Heroicon: Cog6Tooth -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.212-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </button>

        <!-- Theme Toggle -->
        <button class="theme-toggle" id="theme-toggle" title="Chuyển đổi giao diện Sáng/Tối" aria-label="Toggle theme">
            <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="display:none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
            </svg>
        </button>

        <!-- Settings Panel (ẩn mặc định) -->
        <div class="settings-panel" id="settings-panel" style="display:none">
            <h3 class="settings-title">Cài đặt kiểm tra</h3>

            <label class="settings-label">Văn phong</label>
            <div class="settings-radio-group">
                <label class="radio-item">
                    <input type="radio" name="writing_style" value="administrative" checked> Hành chính
                </label>
                <label class="radio-item">
                    <input type="radio" name="writing_style" value="journalism"> Báo chí
                </label>
                <label class="radio-item">
                    <input type="radio" name="writing_style" value="free"> Tự do
                </label>
            </div>

            <label class="settings-label">Engine</label>
            <label class="toggle-item"><input type="checkbox" id="set-layer1" checked> Layer 1 — Từ điển</label>
            <label class="toggle-item"><input type="checkbox" id="set-layer2" checked> Layer 2 — NLP</label>

            <label class="settings-label">Loại lỗi</label>
            <label class="toggle-item"><input type="checkbox" id="set-informal" checked> Khẩu ngữ / Teencode</label>
            <label class="toggle-item"><input type="checkbox" id="set-dialect" checked> Phương ngữ</label>
            <label class="toggle-item"><input type="checkbox" id="set-punctuation" checked> Chấm câu</label>
            <label class="toggle-item"><input type="checkbox" id="set-capitalization" checked> Viết hoa</label>
            <label class="toggle-item"><input type="checkbox" id="set-redundancy" checked> Thừa từ / Lặp nghĩa</label>

            <label class="settings-label">Từ điển tùy chỉnh</label>
            <div class="custom-word-form">
                <input type="text" id="cw-wrong" placeholder="Từ sai" class="cw-input">
                <span class="cw-arrow">→</span>
                <input type="text" id="cw-correct" placeholder="Từ đúng" class="cw-input">
                <button class="cw-add-btn" id="cw-add" title="Thêm">+</button>
            </div>
            <div id="cw-list" class="cw-list"></div>

            <label class="settings-label">Từ đã bỏ qua</label>
            <div id="ignored-list" class="cw-list"></div>
        </div>

        <header>
            <div class="logo-area">
                <svg class="logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="28" height="28" rx="6" fill="url(#logo-grad)"/>
                    <path d="M8 19L14 9L20 19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10.5 15H17.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#10B981"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
                </svg>
                <h1>Trợ Lý Tiếng Việt</h1>
            </div>
            <p class="subtitle">Kiểm tra chính tả &amp; Văn phong</p>
        </header>

        <main>
            <div class="status-box" id="status-box">
                Sẵn sàng hoạt động.
            </div>

            <button class="primary-btn" id="run">
                <!-- Heroicon: MagnifyingGlass -->
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
                Quét đoạn chọn
            </button>

            <button class="secondary-btn" id="check-all">
                <!-- Heroicon: Document -->
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                </svg>
                Quét toàn văn bản
            </button>

            <!-- Nút Sửa tất cả (ẩn mặc định, hiện khi có lỗi) -->
            <button class="fix-all-btn" id="fix-all" style="display:none">
                <!-- Heroicon: WrenchScrewdriver -->
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.049.58.025 1.194-.14 1.743" />
                </svg>
                Sửa tất cả
            </button>

            <!-- Nút Reset định dạng (ẩn mặc định) -->
            <button class="reset-format-btn" id="reset-format" style="display:none" onclick="resetFormatting()">
                <!-- Heroicon: ArrowPath -->
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182M2.985 19.644l3.181-3.183" />
                </svg>
                Reset định dạng
            </button>

            <div class="results" id="results">
                <!-- Danh sách lỗi sẽ được render ở đây bởi app.js -->
            </div>
        </main>

        <footer>
            <p>Hybrid Local Engine v1.0.0 &mdash; &copy; 2026 by thanh007</p>
            <div class="connection-status" id="connection-status">
                <span class="status-dot waiting"></span>
                <span>Đang chờ kết nối...</span>
            </div>
        </footer>
    </div>

    <script src="app.js?v=20260314b"></script>
</body>
</html>
